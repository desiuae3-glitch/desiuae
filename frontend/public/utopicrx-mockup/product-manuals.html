<meta name="description" content="Download user manuals and installation guides for all DESi Utopic RX products — lock, face reader, fingerprint, WiFi bridge, and accessories.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.manual-wrap{max-width:1100px;margin:0 auto;padding:0 2rem 4rem}
.manual-hero{padding:2rem 0 2.5rem;border-bottom:1px solid var(--brd);margin-bottom:2.5rem}
.manual-hero .eyebrow{font-family:var(--m);font-size:.62rem;color:var(--red);letter-spacing:.2em;text-transform:uppercase;font-weight:500;margin-bottom:.75rem}
.manual-hero h1{font-size:clamp(1.75rem,3.5vw,2.35rem);font-weight:900;letter-spacing:-.03em;line-height:1.1}
.manual-hero .intro{margin-top:1rem;color:var(--tx2);font-size:.92rem;line-height:1.75;max-width:680px}
.manual-sec{margin-bottom:2.5rem}
.manual-sec h2{font-size:1rem;font-weight:800;margin-bottom:.35rem;color:#fff}
.manual-sec .sub{font-size:.78rem;color:var(--tx3);margin-bottom:1.15rem}
.manual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.m-card{border:1px solid var(--brd);border-radius:var(--r);background:var(--black3);overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.m-card:hover{border-color:rgba(227,30,36,.35);transform:translateY(-3px);box-shadow:var(--s2)}
.m-card-img{background:var(--black2);padding:1.25rem;display:grid;place-items:center;min-height:160px;border-bottom:1px solid var(--brd)}
.m-card-img img{max-height:120px;width:auto;max-width:100%;object-fit:contain}
.m-card-body{padding:1.15rem 1.2rem 1.25rem;display:flex;flex-direction:column;flex:1}
.m-card-body h3{font-size:.88rem;font-weight:800;line-height:1.35;color:#fff;margin-bottom:.65rem;flex:1}
.m-card-actions{display:flex;flex-direction:column;gap:.45rem}
.m-card-actions a{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.55rem .85rem;border-radius:100px;text-align:center;transition:background .2s,border-color .2s}
.m-btn-manual{background:var(--red);color:#fff}
.m-btn-manual:hover{background:#c4191f;color:#fff}
.m-btn-specs{background:transparent;border:1px solid var(--brd2);color:var(--tx2)}
.m-btn-specs:hover{border-color:var(--red);color:#fff}
.manual-contact{background:var(--black3);border:1px solid var(--brd);border-radius:var(--rs);padding:1.5rem;text-align:center;margin-top:1rem}
.manual-contact h2{font-size:1.1rem;font-weight:800;margin-bottom:.5rem}
.manual-contact p{font-size:.85rem;color:var(--tx2);margin-bottom:1rem;line-height:1.65}
.manual-contact a{color:var(--red);font-weight:700}
@media(max-width:900px){.manual-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.manual-grid{grid-template-columns:1fr}}
</style>
